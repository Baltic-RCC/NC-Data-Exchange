image: python:3.11

variables:
  GITLAB_REGISTRY: "https://git.rsc-gitlab.elering.sise/api/v4/projects/73/packages/pypi"

# Define stages
stages:
  - sync
  - build
  - publish

deploy-to-github:
  stage: sync
  script:
    - apk add --no-cache git
    - git config --global http.sslVerify false
    - git clone --branch main --single-branch https://package-distribution:$GITLAB_TOKEN@git.rsc-gitlab.elering.sise/rsc/it/nc-data-exchange.git repo
    - cd repo
    - git remote add github https://$GITHUB_TOKEN@$REPOSITORY
    - git push --force github main
  only:
    - main
  when: manual

build_package:
  stage: build
  before_script:
  - apt-get update && apt-get install -y ca-certificates
  - curl -k https://artifactory.elering.sise:443/artifactory/certs/ca/EleringCAchain.cer -o /usr/local/share/ca-certificates/elering_chain.crt
  - update-ca-certificates
  - python -m pip install --upgrade pip
  - pip install setuptools wheel twine
  script:
    - python setup.py sdist bdist_wheel
    - ls -lh dist/
  artifacts:
    paths:
      - dist/*
    expire_in: 1 hour
  rules:
    - changes:
        - setup.py
      if: '$CI_COMMIT_BRANCH == "main"'

publish_package:
  stage: publish
  script:
    - TWINE_CERT=/usr/local/share/ca-certificates/elering_chain.crt
    - TWINE_PASSWORD=${CI_TOKEN} TWINE_USERNAME=pip-access-token python -m twine upload --repository-url "$GITLAB_REGISTRY" --skip-existing dist/* --cert $TWINE_CERT
  rules:
    - changes:
        - setup.py
      if: '$CI_COMMIT_BRANCH == "main"'